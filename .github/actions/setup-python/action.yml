name: Python environment
description: Install Python and project dependencies

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: fft/requirements.txt

    - name: Install Python dependencies
      shell: bash
      run: python -m pip install -r fft/requirements.txt