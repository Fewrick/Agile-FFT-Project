
name: Scala and Chisel regression

on:
  workflow_call:

jobs:
  regression:
    name: Full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: fft

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./fft/.github/actions/setup-python

      - name: Setup hardware
        uses: ./fft/.github/actions/setup-hardware

      - name: Generate sine
        run: make sine

      - name: Run Scala and Chisel tests
        run: |
          set -o pipefail
          sbt test 2>&1 | tee scala-test.log

      - name: Diagnose Verilator compilation
        if: failure()
        run: |
          set -o pipefail

          BUILD_DIR="test_run_dir/FFTDsp_should_correctly_perform_FFT_filtering_and_IFFT/verilated"

          echo "=== Generated PCH files ==="
          ls -lh "$BUILD_DIR"/VFFTDsp__pch* || true

          echo "=== Compiler configuration ==="
          grep -E '^(CXX|CXXFLAGS|CPPFLAGS|CFG_CXXFLAGS_PCH_I|CFG_GCH_IF_CLANG)' \
            "$BUILD_DIR/VFFTDsp.mk" || true

          echo "=== Clean native rebuild ==="
          make -C "$BUILD_DIR" -f VFFTDsp.mk clean

          make -C "$BUILD_DIR" \
            -f VFFTDsp.mk \
            -j1 \
            V=1 \
            2>&1 | tee verilator-build.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scala-test-logs
          path: |
            fft/scala-test.log
            fft/verilator-build.log
          if-no-files-found: warn