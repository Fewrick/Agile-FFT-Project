
name: Scala and Chisel regression

on:
  workflow_call:

jobs:
  regression:
    name: Full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: fft

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./fft/.github/actions/setup-python

      - name: Setup hardware
        uses: ./fft/.github/actions/setup-hardware

      - name: Generate sine
        run: make sine

      - name: Run Scala and Chisel tests
        run: |
          set -o pipefail
          sbt test 2>&1 | tee scala-test.log

      - name: Diagnose Verilator compilation
        if: failure()
        run: |
          set -o pipefail

          echo "=== System memory ==="
          free -h

          echo "=== Compiler ==="
          g++ --version

          echo "=== Possible OOM events ==="
          sudo dmesg 2>/dev/null | \
            grep -iE 'out of memory|killed process' || true

          BUILD_DIR="test_run_dir/FFTDsp_should_correctly_perform_FFT_filtering_and_IFFT/verilated"

          if [ -f "$BUILD_DIR/VFFTDsp.mk" ]; then
            echo "=== Rebuilding failed simulator ==="

            make -C "$BUILD_DIR" \
              -f VFFTDsp.mk \
              -j1 \
              V=1 \
              2>&1 | tee verilator-build.log
          else
            echo "Generated Verilator Makefile not found"
            find . -name VFFTDsp.mk -print
          fi

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scala-test-logs
          path: |
            fft/scala-test.log
            fft/verilator-build.log
          if-no-files-found: warn