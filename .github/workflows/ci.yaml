
name: Scala and Chisel regression

on:
  workflow_call:

jobs:
  regression:
    name: Full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: fft

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: ./fft/.github/actions/setup-python

      - name: Setup hardware
        uses: ./fft/.github/actions/setup-hardware

      - name: Generate sine
        run: make sine

      - name: Run Scala and Chisel tests
        run: sbt test