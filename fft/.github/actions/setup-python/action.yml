name: Python test environment
description: Pinned ONNX numerical oracle, optionally with CPU PyTorch for training unit tests
inputs:
  training-tests:
    description: Install CPU PyTorch and torchvision for the synthetic training-functionality tests
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: |
          ci/requirements.txt
          ci/training-requirements.txt
    - name: Install numerical test dependencies
      shell: bash
      run: python -m pip install -r ci/requirements.txt
    - name: Install CPU training-test dependencies
      if: inputs.training-tests == 'true'
      shell: bash
      run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r ci/training-requirements.txt
    - name: Check Python dependencies
      shell: bash
      run: |
        python --version
        python -m pip check
        python -m pip freeze